[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-slm"
version = "0.1.0"
description = "Compiling a workflow into a small language model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
    "openai>=1.50.0",
    "google-genai>=2.0.0",
    "anthropic>=0.30.0"
]

[project.optional-dependencies]
local = [
    "torch>=2.7.0",
    "transformers>=4.56.0,<5",
    "peft>=0.17.0,<1",
    "accelerate>=1.0.0,<2",
    "bitsandbytes>=0.46.0,<1",
]
serve = [
    "vllm>=0.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
